# Branch-only, one-time telemetry lockfile remediation; no production deployment.
name: Telemetry LCM Remediation Validation

on:
  push:
    branches: [fix/security-telemetry-remediation]
    paths:
      - "telemetry-worker/package.json"
      - ".github/workflows/lcm-telemetry-repair-once.yml"

permissions:
  contents: write

concurrency:
  group: telemetry-lcm-lockfile-repair
  cancel-in-progress: false

jobs:
  repair-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate dependencies from patched pre-seven-day cutoff
        working-directory: telemetry-worker
        shell: bash
        run: |
          set -euo pipefail
          cutoff="$(date -u -d '7 days ago' '+%Y-%m-%dT%H:%M:%SZ')"
          rm -- package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --before="$cutoff"
      - name: Enforce minimum release age
        run: python scripts/check_dependency_age.py --base origin/main
      - name: Reject newly introduced OSV advisories
        run: python scripts/check_dependency_advisories.py --base origin/main
      - name: Require zero moderate, high and critical npm audit findings
        working-directory: telemetry-worker
        run: npm audit --package-lock-only --audit-level=moderate
      - name: Verify Cloudflare Worker types and compilation without deploying
        working-directory: telemetry-worker
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          cp .dev.vars.example .dev.vars
          npm run check
      - name: Commit verified lockfile and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add telemetry-worker/package-lock.json
          git rm .github/workflows/lcm-telemetry-repair-once.yml
          git commit -m "fix(deps): lock patched telemetry worker dependencies"
          git push origin HEAD:fix/security-telemetry-remediation
