name: Build docs site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy-site.yml'
  pull_request:
    paths:
      - 'site/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

# Netlify publishes the production site. This workflow only validates it.
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Chrome for share-card screenshots
        run: sudo npx puppeteer browsers install chrome --install-deps
      - name: Build docs site
        run: npm run build
      - name: Test docs site
        run: npm test
      - name: Upload site build
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: site/dist
          if-no-files-found: error
