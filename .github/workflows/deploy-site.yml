name: Build docs site

on:
  workflow_dispatch:

env:
  ASTRO_TELEMETRY_DISABLED: "1"

permissions:
  contents: read
  actions: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

# Validate documentation and retain an artifact. Deployments are managed separately.
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Chrome for share-card screenshots
        run: sudo npx puppeteer browsers install chrome --install-deps
      - name: Resolve complete published release for production downloads
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view --repo "$GITHUB_REPOSITORY" --json tagName,assets > /tmp/published-release.json
          for asset in ax-win32-x64.zip ax-win32-arm64.zip ax-linux-x64.tar.gz ax-linux-arm64.tar.gz ax-darwin-x64.tar.gz ax-darwin-arm64.tar.gz; do
            jq -e --arg asset "$asset" '.assets | any(.name == $asset)' /tmp/published-release.json > /dev/null
          done
          jq -r '.tagName' /tmp/published-release.json > public/releases/latest.txt
      - name: Build docs site
        run: npm run build
      - name: Test docs site
        run: npm test
      - name: Upload site build
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: site/dist
          if-no-files-found: error
