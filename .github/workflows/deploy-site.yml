name: Build docs site

on:
  workflow_dispatch:

env:
  ASTRO_TELEMETRY_DISABLED: "1"

permissions:
  contents: read
  actions: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

# Build and test the documentation. Only a run from main deploys it to GitHub Pages,
# and only after the published release has every platform asset.
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install zsh for PATH persistence tests
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh
      - name: Install Chrome for share-card screenshots
        run: sudo npx puppeteer browsers install chrome --install-deps
      - name: Resolve complete published release for production downloads
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view --repo "$GITHUB_REPOSITORY" --json tagName,assets > /tmp/published-release.json
          for asset in ax-win32-x64.zip ax-win32-arm64.zip ax-linux-x64.tar.gz ax-linux-arm64.tar.gz ax-darwin-x64.tar.gz ax-darwin-arm64.tar.gz; do
            jq -e --arg asset "$asset" '.assets | any(.name == $asset)' /tmp/published-release.json > /dev/null
          done
          jq -r '.tagName' /tmp/published-release.json > public/releases/latest.txt
      - name: Build docs site
        run: npm run build
      - name: Test docs site
        run: npm test
      - name: Upload site build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docs-site
          path: site/dist
          if-no-files-found: error
      - name: Rebuild docs for the GitHub Pages mirror
        env:
          SITE_BASE: /ax
        run: npx astro build
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site/dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Ensure GitHub Pages is enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1; then
            gh api -X POST "repos/${GITHUB_REPOSITORY}/pages" -f build_type=workflow
          fi
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
