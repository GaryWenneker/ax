name: Build docs site

on:
  workflow_dispatch:

env:
  ASTRO_TELEMETRY_DISABLED: "1"

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

# Validate documentation and retain an artifact. Deployments are managed separately.
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install zsh for PATH persistence tests
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh
      - name: Install Chrome for share-card screenshots
        run: sudo npx puppeteer browsers install chrome --install-deps
      - name: Resolve complete published release for production downloads
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view --repo "$GITHUB_REPOSITORY" --json tagName,assets > /tmp/published-release.json
          for asset in ax-win32-x64.zip ax-win32-arm64.zip ax-linux-x64.tar.gz ax-linux-arm64.tar.gz ax-darwin-x64.tar.gz ax-darwin-arm64.tar.gz; do
            jq -e --arg asset "$asset" '.assets | any(.name == $asset)' /tmp/published-release.json > /dev/null
          done
          jq -r '.tagName' /tmp/published-release.json > public/releases/latest.txt
      - name: Build docs site
        run: npm run build
      - name: Test docs site
        run: npm test
      - name: Upload site build
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: site/dist
          if-no-files-found: error
      - name: Rebuild docs for the GitHub Pages mirror
        env:
          SITE_BASE: /ax
        run: npx astro build
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Ensure GitHub Pages is enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1; then
            gh api -X POST "repos/${GITHUB_REPOSITORY}/pages" -f build_type=workflow
          fi
      - id: deployment
        uses: actions/deploy-pages@v5
