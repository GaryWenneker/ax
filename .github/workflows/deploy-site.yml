name: Build docs site

on:
  push:
    branches: [main, feat/minimal-project-safe-context, feature/remote-mcp-oauth-complete, fix/site-main-version]
    paths:
      - 'site/**'
      - '.github/workflows/deploy-site.yml'
  pull_request:
    paths:
      - 'site/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

env:
  ASTRO_TELEMETRY_DISABLED: "1"

permissions:
  contents: read
  actions: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

# Feature branches validate only. Production publishes after the main CI run succeeds.
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Chrome for share-card screenshots
        run: sudo npx puppeteer browsers install chrome --install-deps
      - name: Build docs site
        run: npm run build
      - name: Test docs site
        run: npm test
      - name: Upload site build
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: site/dist
          if-no-files-found: error

      - name: Wait for workspace CI before publishing production
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 100); do
            result=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --event push --limit 1 --json status,conclusion --jq '.[0] | [.status, .conclusion] | @tsv')
            case "$result" in
              $'completed\tsuccess') exit 0 ;;
              completed*) echo "::error::Workspace CI did not succeed: $result"; exit 1 ;;
            esac
            sleep 15
          done
          echo "::error::Workspace CI did not finish before the deployment timeout"
          exit 1
      - name: Publish validated docs and functions to Netlify
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -z "${NETLIFY_AUTH_TOKEN:-}" ] || [ -z "${NETLIFY_SITE_ID:-}" ]; then
            echo "::error::NETLIFY_AUTH_TOKEN and NETLIFY_SITE_ID repository secrets are required to publish docs"
            exit 1
          fi
          npx --yes netlify-cli deploy --prod --dir=dist --functions=netlify/functions --site="$NETLIFY_SITE_ID" --message="Validated docs $GITHUB_SHA"
