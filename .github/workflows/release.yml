name: Release
run-name: Release from main

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional tag; must match main's CLI version."
        required: false

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      tag: ${{ steps.source.outputs.tag }}
      publish: ${{ steps.source.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Validate main source and successful CI
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag }}
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          if [ -n "$VALIDATED_SHA" ] && [ "$VALIDATED_SHA" != "$SHA" ]; then
            echo "A newer main commit exists; its CI will handle the release."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CI=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$SHA" --limit 20 --json status,conclusion --jq '[.[] | select(.status=="completed" and .conclusion=="success")] | length')
          [ "$CI" -ge 1 ] || { echo "::error::main CI must pass before release"; exit 1; }
          VERSION=$(sed -n 's/^version = "\([^"]*\)"/\1/p' crates/ax-cli/Cargo.toml | head -1)
          TAG="v$VERSION"
          [ -z "$REQUESTED_TAG" ] || [ "$REQUESTED_TAG" = "$TAG" ] || { echo "::error::Requested tag differs from main version"; exit 1; }
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            git merge-base --is-ancestor "$TAG^{commit}" origin/main || { echo "::error::Tag is not from main"; exit 1; }
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' > /tmp/release-draft 2>/dev/null; then
            if [ "$(cat /tmp/release-draft)" = false ]; then
              gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' > /tmp/release-assets
              for asset in ax-win32-x64.zip ax-win32-arm64.zip ax-linux-x64.tar.gz ax-linux-arm64.tar.gz ax-darwin-x64.tar.gz ax-darwin-arm64.tar.gz SHA256SUMS; do
                grep -Fxq "$asset" /tmp/release-assets || { echo "::error::Published release is incomplete: $asset"; exit 1; }
              done
              echo "Release $TAG is already published; published releases are immutable."
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            [ "$(git rev-parse "$TAG^{commit}")" = "$SHA" ] || { echo "::error::Draft tag differs from main HEAD"; exit 1; }
          fi
          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            [ "$(git rev-parse "$TAG^{commit}")" = "$SHA" ] || { echo "::error::Unpublished tag differs from validated main HEAD"; exit 1; }
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    name: build-${{ matrix.bundle }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundle: win32-x64
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            bundle: win32-arm64
            target: aarch64-pc-windows-msvc
          - os: ubuntu-latest
            bundle: linux-x64
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            bundle: linux-arm64
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            bundle: darwin-arm64
            target: aarch64-apple-darwin
          - os: macos-latest
            bundle: darwin-x64
            target: x86_64-apple-darwin

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Build ax web UI
        run: |
          cd crates/ax-web/web-ui
          npm ci
          npm run build

      - name: Install Linux cross toolchain (arm64)
        if: matrix.bundle == 'linux-arm64'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build ax
        run: |
          cargo clean -p ax-cli
          cargo build --release --locked -p ax-cli --target ${{ matrix.target }}

      - name: Package archive
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/package-release.sh ${{ matrix.bundle }} ${{ matrix.target }}

      - name: Package archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package-release.ps1 -Bundle ${{ matrix.bundle }} -RustTarget ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: ax-${{ matrix.bundle }}
          path: dist/ax-${{ matrix.bundle }}.*

  build-slim:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    name: build-slim-linux-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x64
          - os: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Build static headless binary (slim/Dockerfile, native architecture)
        run: |
          docker build -f slim/Dockerfile --target builder -t ax-slim-builder .
          cid="$(docker create ax-slim-builder)"
          docker cp "$cid:/out/ax" ./ax-slim
          docker rm "$cid"
          file ./ax-slim | grep -q static
          ./ax-slim version
      - name: Package archive
        run: bash scripts/package-slim-release.sh ${{ matrix.arch }} ./ax-slim
      - uses: actions/upload-artifact@v4
        with:
          name: ax-slim-linux-${{ matrix.arch }}
          path: dist/ax-slim-linux-${{ matrix.arch }}.tar.gz

  build-admin:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    name: build-admin-${{ matrix.bundle }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundle: win32-x64
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            bundle: win32-arm64
            target: aarch64-pc-windows-msvc
          - os: ubuntu-latest
            bundle: linux-x64
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            bundle: linux-arm64
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            bundle: darwin-arm64
            target: aarch64-apple-darwin
          - os: macos-latest
            bundle: darwin-x64
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          key: admin
      - name: Build ax-admin UI
        run: |
          cd crates/ax-admin/web-ui
          npm ci
          npm run build
      - name: Install Linux cross toolchain (arm64)
        if: matrix.bundle == 'linux-arm64'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      - name: Build ax-admin
        shell: bash
        env:
          AX_SKIP_WEB_BUILD: "1"
        run: cargo build --release --locked -p ax-admin --target ${{ matrix.target }}
      - name: Package archive
        shell: bash
        run: |
          bin="target-dev/${{ matrix.target }}/release/ax-admin"
          [ -f "$bin" ] || bin="target/${{ matrix.target }}/release/ax-admin"
          [ -f "$bin" ] || bin="$bin.exe"
          [ -f "$bin" ] || bin="target-dev/${{ matrix.target }}/release/ax-admin.exe"
          bash scripts/package-admin-release.sh ${{ matrix.bundle }} "$bin"
      - uses: actions/upload-artifact@v4
        with:
          name: ax-admin-${{ matrix.bundle }}
          path: dist/ax-admin-${{ matrix.bundle }}.*

  release:
    needs: [prepare, build, build-slim, build-admin]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: ax-*
          merge-multiple: true
      - name: Verify all six platform assets and checksums
        run: |
          bash scripts/verify-release-assets.sh dist
          for asset in ax-slim-linux-x64.tar.gz ax-slim-linux-arm64.tar.gz; do
            [ -f "dist/$asset" ] || { echo "::error::Missing headless asset: $asset"; exit 1; }
          done
          for asset in ax-admin-win32-x64.zip ax-admin-win32-arm64.zip ax-admin-linux-x64.tar.gz ax-admin-linux-arm64.tar.gz ax-admin-darwin-x64.tar.gz ax-admin-darwin-arm64.tar.gz; do
            [ -f "dist/$asset" ] || { echo "::error::Missing ax-admin asset: $asset"; exit 1; }
          done
          cd dist
          sha256sum ax-* > SHA256SUMS
      - name: Stage complete release from validated main commit
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ needs.prepare.outputs.sha }}
          name: ${{ needs.prepare.outputs.tag }}
          draft: true
          fail_on_unmatched_files: true
          body: |
            Ax built from main commit ${{ needs.prepare.outputs.sha }} after successful workspace CI.
            Native binaries for Windows x64/arm64, Linux and WSL2 x64/arm64, and macOS Intel/Apple Silicon.
            Headless Linux builds (ax-slim-linux-x64/arm64) for sandboxes and containers: install-slim.sh.
            ax-admin, the standalone admin application for a remote Ax: install-admin.sh / install-admin.ps1.
          files: |
            dist/ax-darwin-arm64.tar.gz
            dist/ax-darwin-x64.tar.gz
            dist/ax-linux-arm64.tar.gz
            dist/ax-linux-x64.tar.gz
            dist/ax-win32-arm64.zip
            dist/ax-win32-x64.zip
            dist/ax-slim-linux-x64.tar.gz
            dist/ax-slim-linux-arm64.tar.gz
            dist/ax-admin-darwin-arm64.tar.gz
            dist/ax-admin-darwin-x64.tar.gz
            dist/ax-admin-linux-arm64.tar.gz
            dist/ax-admin-linux-x64.tar.gz
            dist/ax-admin-win32-arm64.zip
            dist/ax-admin-win32-x64.zip
            dist/SHA256SUMS
      - name: Verify uploaded assets before publishing
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' > /tmp/release-assets
          for asset in ax-win32-x64.zip ax-win32-arm64.zip ax-linux-x64.tar.gz ax-linux-arm64.tar.gz ax-darwin-x64.tar.gz ax-darwin-arm64.tar.gz ax-slim-linux-x64.tar.gz ax-slim-linux-arm64.tar.gz ax-admin-win32-x64.zip ax-admin-win32-arm64.zip ax-admin-linux-x64.tar.gz ax-admin-linux-arm64.tar.gz ax-admin-darwin-x64.tar.gz ax-admin-darwin-arm64.tar.gz SHA256SUMS; do
            grep -Fxq "$asset" /tmp/release-assets || { echo "::error::Missing uploaded asset: $asset"; exit 1; }
          done
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest

  publish-slim-image:
    needs: [prepare, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: ax-slim-linux-*
          merge-multiple: true
      - name: Stage release binaries per Docker architecture
        run: |
          mkdir -p image/amd64 image/arm64
          tar -xzf dist/ax-slim-linux-x64.tar.gz -C dist
          tar -xzf dist/ax-slim-linux-arm64.tar.gz -C dist
          cp dist/ax-slim-linux-x64/ax image/amd64/ax
          cp dist/ax-slim-linux-arm64/ax image/arm64/ax
          cp slim/Dockerfile.release image/Dockerfile
          cp slim/ax-index-repo.sh image/ax-index-repo.sh
          cp slim/ax-serve-repo.sh image/ax-serve-repo.sh
      - name: Image name and version tag
        id: image
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ax-slim" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Push distroless image
        uses: docker/build-push-action@v7
        with:
          context: image
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}
            ${{ steps.image.outputs.name }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Headless ax (CLI + MCP server) for Linux containers
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
      - name: Push Ubuntu image (shell and git)
        uses: docker/build-push-action@v7
        with:
          context: image
          target: ubuntu
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}-ubuntu
            ${{ steps.image.outputs.name }}:latest-ubuntu
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Headless ax (CLI + MCP server) with git, for Linux containers
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
      - name: Push server image (ax-serve-repo entry point)
        uses: docker/build-push-action@v7
        with:
          context: image
          target: server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}-server
            ${{ steps.image.outputs.name }}:latest-server
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Headless ax as a hosted remote MCP server for one repository
            org.opencontainers.image.version=${{ steps.image.outputs.version }}

  build-docs:
    needs: [prepare, release]
    if: >-
      always() && needs.prepare.result == 'success' && needs.prepare.outputs.tag != '' &&
      (needs.release.result == 'success' || needs.prepare.outputs.publish == 'false')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Update download pointer after complete release
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          echo "$RELEASE_TAG" > site/public/releases/latest.txt
          cp install.sh install.ps1 install-slim.sh install-admin.sh install-admin.ps1 site/public/
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install zsh for PATH persistence tests
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh
      - name: Build and test released documentation
        working-directory: site
        run: |
          npm ci
          sudo npx puppeteer browsers install chrome --install-deps
          npm run build
          npm test
      - name: Upload released documentation
        uses: actions/upload-artifact@v4
        with:
          name: released-docs-site
          path: site/dist
          if-no-files-found: error
      - name: Rebuild documentation for the GitHub Pages mirror
        working-directory: site
        env:
          SITE_BASE: /ax
        run: npx astro build
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy-pages:
    needs: [prepare, build-docs]
    if: needs.build-docs.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Ensure GitHub Pages is enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1; then
            gh api -X POST "repos/${GITHUB_REPOSITORY}/pages" -f build_type=workflow
          fi
      - id: deployment
        uses: actions/deploy-pages@v4
