# Temporary build-tool security validation, removed before committing verified lockfile.
name: Site Build Tools LCM Validation
on:
  push:
    branches: [fix/security-site-build-tools]
    paths:
      - "site/package.json"
      - "site/puppeteer.config.cjs"
      - "site/tests/puppeteer-config.test.ts"
      - "site/tests/design-coherence.test.ts"
      - ".github/workflows/lcm-site-tooling-repair-once.yml"
permissions:
  contents: write
concurrency:
  group: site-tooling-lcm-remediation
  cancel-in-progress: false
jobs:
  verify-and-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Synchronize merged security fixes from main before full-repo OSV review
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
      - name: Generate only eligible registry versions
        shell: bash
        working-directory: site
        run: |
          set -euo pipefail
          cutoff="$(date -u -d '7 days ago' '+%Y-%m-%dT%H:%M:%SZ')"
          rm -- package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --before="$cutoff"
          # Do not run npm audit fix here: it can reintroduce vulnerable
          # esbuild@0.21.5 under Netlify despite the reviewed override.
          # The following OSV and npm audit steps must verify the fresh tree.
      - name: Ensure npm did not alter manifest outside reviewed changes
        run: git diff --exit-code -- site/package.json
      - name: Explain resolved esbuild dependency versions
        shell: bash
        run: |
          node - <<'JS'
          const lock = require('./site/package-lock.json');
          const root = require('./site/package.json');
          console.log('NPM overrides:', JSON.stringify(root.overrides));
          for (const [path, data] of Object.entries(lock.packages)) {
            if (path.endsWith('/esbuild') || path === 'node_modules/esbuild') {
              console.log('ESBUILD:', path, data.version);
            }
          }
          JS
      - name: Enforce 168-hour release age
        run: python scripts/check_dependency_age.py --base origin/main
      - name: Reject new known OSV advisories
        run: python scripts/check_dependency_advisories.py --base origin/main
      - name: Require zero moderate/high/critical audit findings
        working-directory: site
        run: npm audit --package-lock-only --audit-level=moderate
      - name: Install and build the website
        working-directory: site
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          npm run build
      - name: Commit regenerated lockfile and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/package-lock.json
          git rm .github/workflows/lcm-site-tooling-repair-once.yml
          git commit -m "fix(deps): lock patched website build-tool dependencies"
          git push origin HEAD:fix/security-site-build-tools
