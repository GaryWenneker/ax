# Temporary build-tool security validation, removed before committing verified lockfile.
name: Site Build Tools LCM Validation
on:
  push:
    branches: [fix/security-site-build-tools]
    paths:
      - "site/package.json"
      - ".github/workflows/lcm-site-tooling-repair-once.yml"
permissions:
  contents: write
concurrency:
  group: site-tooling-lcm-remediation
  cancel-in-progress: false
jobs:
  verify-and-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate only eligible registry versions
        shell: bash
        working-directory: site
        run: |
          set -euo pipefail
          cutoff="$(date -u -d '7 days ago' '+%Y-%m-%dT%H:%M:%SZ')"
          rm -- package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --before="$cutoff"
          set +e
          npm audit fix --package-lock-only --ignore-scripts --no-fund --before="$cutoff"
          fix_exit=$?
          set -e
          if [ "$fix_exit" -gt 1 ]; then exit "$fix_exit"; fi
      - name: Ensure npm did not alter manifest outside reviewed changes
        run: git diff --exit-code -- site/package.json
      - name: Enforce 168-hour release age
        run: python scripts/check_dependency_age.py --base origin/main
      - name: Reject new known OSV advisories
        run: python scripts/check_dependency_advisories.py --base origin/main
      - name: Require zero moderate/high/critical audit findings
        working-directory: site
        run: npm audit --package-lock-only --audit-level=moderate
      - name: Install and build the website
        working-directory: site
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          npm run build
      - name: Commit regenerated lockfile and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/package-lock.json
          git rm .github/workflows/lcm-site-tooling-repair-once.yml
          git commit -m "fix(deps): lock patched website build-tool dependencies"
          git push origin HEAD:fix/security-site-build-tools
