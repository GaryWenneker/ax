name: CI

on:
  push:
    branches: [main, master, develop, feat/minimal-project-safe-context, feature/remote-mcp-oauth-complete, feature/standalone-ax]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: detect-changed-components
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.paths.outputs.backend }}
      frontend: ${{ steps.paths.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify change classification
        run: python -m unittest discover -s scripts -p 'test_ci_changes.py'
      - name: Classify changed paths
        id: paths
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/ci-changes.py

  test:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    name: test-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          # Release builds use a separate cache; CI only compiles dev profile.
          shared-key: ci-test

      - name: Build workspace
        run: cargo build --workspace --locked

      - name: Run tests
        env:
          AX_TEST_UNIX_SOCKETS: "1"
        run: cargo test --workspace --locked --no-fail-fast

  lint:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-lint

      - name: Home dir goes through ax_utils
        run: ./scripts/check-home-dir.sh

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  remote-settings:
    name: frontend-build-and-browser
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/ax-web/web-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/ax-web/web-ui/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build UI
        run: npm run build
      - name: Theme contrast tests
        run: node --experimental-strip-types --test src/lib/themes.test.ts
      - name: Test Remote Settings and portal pages
        env:
          AX_WEB_URL: http://127.0.0.1:5190
        run: |
          npm run dev -- --host 127.0.0.1 --port 5190 > /tmp/remote-vite.log 2>&1 &
          VITE_PID=$!
          trap 'kill "$VITE_PID"' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent "$AX_WEB_URL/settings" > /dev/null; then break; fi
            sleep 1
          done
          npm run test:e2e -- remote-mcp.spec.ts azure-portal.spec.ts access-settings.spec.ts --project=desktop-chrome
