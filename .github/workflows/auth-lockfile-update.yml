name: Refresh auth dependency lockfile
on:
  push:
    branches: [feature/command-center-auth-passkeys-spec]
    paths:
      - '.github/workflows/auth-lockfile-update.yml'
permissions:
  contents: write
jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Resolve and validate Rust dependencies
        run: cargo check -p ax-web -p ax-global-db
      - name: Commit lockfile if updated
        run: |
          if git diff --quiet -- Cargo.lock; then
            echo "Lockfile already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "build(auth): lock WebAuthn and password hashing dependencies"
          git push origin HEAD:feature/command-center-auth-passkeys-spec
