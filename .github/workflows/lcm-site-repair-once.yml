# One-time branch-scoped website security repair; removed from the successful PR.
name: Site LCM Remediation Validation

on:
  push:
    branches: [fix/security-site-remediation]
    paths:
      - "site/package.json"
      - ".github/workflows/lcm-site-repair-once.yml"

permissions:
  contents: write

concurrency:
  group: site-lcm-lockfile-repair
  cancel-in-progress: false

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit baseline site dependency lockfile
        working-directory: site
        shell: bash
        run: |
          set -euo pipefail
          npm audit --package-lock-only --json > "$RUNNER_TEMP/site-before.json" || test "$?" -eq 1
      - name: Resolve known fixed releases no younger than seven days
        working-directory: site
        shell: bash
        run: |
          set -euo pipefail
          cutoff="$(date -u -d '7 days ago' '+%Y-%m-%dT%H:%M:%SZ')"
          # Re-resolve the old Astro 6 peer graph; retaining that lock creates ERESOLVE.\n          rm -- package-lock.json\n          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --before="$cutoff"
      - name: Enforce strict 168-hour release age
        run: python scripts/check_dependency_age.py --base origin/main
      - name: Block newly introduced known OSV advisories
        run: python scripts/check_dependency_advisories.py --base origin/main
      - name: Verify npm audit risk strictly decreased
        working-directory: site
        shell: bash
        run: |
          set -euo pipefail
          npm audit --package-lock-only --json > "$RUNNER_TEMP/site-after.json" || test "$?" -eq 1
          python - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, '../scripts')
          from lcm_autofix import severity_counts, is_improvement
          old = severity_counts(json.loads(Path(__import__('os').environ['RUNNER_TEMP'] + '/site-before.json').read_text()))
          new = severity_counts(json.loads(Path(__import__('os').environ['RUNNER_TEMP'] + '/site-after.json').read_text()))
          print(f'BEFORE: {old} AFTER: {new}')
          if not is_improvement(old, new):
              raise SystemExit('No safe reduction in vulnerability count')
          if new['critical']:
              raise SystemExit('Critical vulnerabilities remain; website proposal requires further remediation')
          PY
      - name: Install and test website with new lockfile
        working-directory: site
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          npm run build
      - name: Commit verified lockfile and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/package-lock.json
          git rm .github/workflows/lcm-site-repair-once.yml
          git commit -m "fix(deps): lock validated security updates for AX website"
          git push origin HEAD:fix/security-site-remediation
