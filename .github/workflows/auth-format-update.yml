name: Format Command Center authentication sources
on:
  push:
    branches: [feature/command-center-auth-passkeys-spec]
    paths:
      - '.github/workflows/auth-format-update.yml'
permissions:
  contents: write
jobs:
  rustfmt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format workspace Rust sources
        run: cargo fmt --all
      - name: Commit changed auth sources only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/ax-web/src/web_auth.rs crates/ax-web/src/access_api.rs
          git add crates/ax-web/src/workspace_state.rs crates/ax-web/src/lib.rs
          git add crates/ax-global-db/src/access.rs crates/ax-global-db/src/database/mod.rs
          if git diff --cached --quiet; then
            echo "Auth Rust files already formatted"
            exit 0
          fi
          git commit -m "style(auth): apply rustfmt to authentication implementation"
          git push origin HEAD:feature/command-center-auth-passkeys-spec
