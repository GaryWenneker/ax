# Dependabot version PRs wait seven full days after a registry release.
# Security advisory alerts and security-fix PRs are NOT delayed by cooldown.
version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10

  - package-ecosystem: "npm"
    directory: "/site"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10

  - package-ecosystem: "npm"
    directory: "/telemetry-worker"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10

  - package-ecosystem: "npm"
    directory: "/crates/ax-web/web-ui"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
