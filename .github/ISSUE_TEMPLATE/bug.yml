name: Bug report
description: Report incorrect or broken behavior
title: "[bug] "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: ax version
      placeholder: "ax --version"
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
    validations:
      required: true
