[workspace]
members = [
    "crates/ax-types",
    "crates/ax-utils",
    "crates/ax-db",
    "crates/ax-extraction",
    "crates/ax-resolution",
    "crates/ax-graph",
    "crates/ax-context",
    "crates/ax-sync",
    "crates/ax-core",
    "crates/ax-mcp",
    "crates/ax-memory",
    "crates/ax-cli",
    "crates/ax-telemetry",
    "crates/ax-usage",
    "crates/ax-reasoning",
    "crates/ax-policy",
    "crates/ax-share",
    "crates/ax-smoke-tests",
    "crates/ax-web",
    "crates/ax-desktop-client",
    "crates/ax-git",
    "crates/ax-tia",
    "crates/ax-ship",
    "crates/ax-quality",
    "crates/ax-remote",
    "crates/ax-installer",
    "crates/ax-agent",
    "crates/ax-plugins",
    "crates/ax-lsp",
]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
tree-sitter = "0.25"
petgraph = "0.6"
leiden-rs = { version = "0.8", default-features = false }
pulldown-cmark = { version = "0.12", default-features = false }
blake3 = "1"
rayon = "1"
notify = "6"
walkdir = "2"
ignore = "0.4"
clap = { version = "4", features = ["derive", "color"] }
lru = "0.12"
regex = "1"
uuid = { version = "1", features = ["v4"] }
dialoguer = "0.11"
console = "0.15"
indicatif = "0.17"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
fs2 = "0.4"
dirs = "5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
self_update = { version = "0.41", default-features = false, features = ["rustls"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"

ax-types = { path = "crates/ax-types" }
ax-utils = { path = "crates/ax-utils" }
ax-telemetry = { path = "crates/ax-telemetry" }
ax-usage = { path = "crates/ax-usage" }
ax-reasoning = { path = "crates/ax-reasoning" }
ax-db = { path = "crates/ax-db" }
ax-extraction = { path = "crates/ax-extraction" }
ax-resolution = { path = "crates/ax-resolution" }
ax-graph = { path = "crates/ax-graph" }
ax-context = { path = "crates/ax-context" }
ax-sync = { path = "crates/ax-sync" }
ax-core = { path = "crates/ax-core" }
ax-mcp = { path = "crates/ax-mcp" }
ax-memory = { path = "crates/ax-memory" }
ax-web = { path = "crates/ax-web" }
ax-desktop-client = { path = "crates/ax-desktop-client" }
ax-policy = { path = "crates/ax-policy" }
ax-share = { path = "crates/ax-share" }
serde_yaml = "0.9"
globset = "0.4"
gix = { version = "0.68", default-features = false, features = ["max-performance-safe"] }
octocrab = "0.43"
toml = "0.8"
futures-util = "0.3"
async-stream = "0.3"

ax-git = { path = "crates/ax-git" }
ax-tia = { path = "crates/ax-tia" }
ax-ship = { path = "crates/ax-ship" }
ax-quality = { path = "crates/ax-quality" }
ax-remote = { path = "crates/ax-remote" }
ax-installer = { path = "crates/ax-installer" }
ax-plugins = { path = "crates/ax-plugins" }
ax-lsp = { path = "crates/ax-lsp" }
ax-agent = { path = "crates/ax-agent" }