# getax.wenneker.io — Astro docs site + telemetry ingest (Netlify Function)

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# Telemetry ingest — same contract as telemetry-worker (POST /v1/events)
[[redirects]]
  from = "/v1/events"
  to = "/.netlify/functions/telemetry-ingest"
  status = 200
  force = true

[[redirects]]
  from = "/telemetry"
  to = "/.netlify/functions/telemetry-ingest"
  status = 200
  force = true

[[redirects]]
  from = "/v1/admin/login"
  to = "/.netlify/functions/admin-auth"
  status = 200
  force = true

[[redirects]]
  from = "/v1/admin/telemetry"
  to = "/.netlify/functions/admin-telemetry"
  status = 200
  force = true

[functions]
  node_bundler = "esbuild"

[functions."telemetry-ingest"]
  timeout = 10

[functions."admin-auth"]
  timeout = 10

[functions."admin-telemetry"]
  timeout = 26

# Version pointer: HTML (lang + title) for browsers; plain text for installers.
# Must come before the GitHub /releases/:version/* redirect.
[[redirects]]
  from = "/releases/latest.txt"
  to = "/.netlify/functions/latest-release"
  status = 200
  force = true

[functions."latest-release"]
  timeout = 5

# Legacy /releases/:version/* CDN URLs redirect to GitHub Releases (binaries no longer mirrored on Netlify).
[[redirects]]
  from = "/releases/:version/*"
  to = "https://github.com/GaryWenneker/ax/releases/download/:version/:splat"
  status = 302
  force = true

# "Deploy to Azure" template (scripts/write-azure-template.mjs). The Azure portal fetches it
# from the browser, so it needs CORS.
[[headers]]
  for = "/deploy/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Content-Type = "application/json; charset=utf-8"
    Cache-Control = "public, max-age=300"

# Admin pages hold the admin bearer token in sessionStorage, so only our own scripts
# (plus the integrity-pinned Chart.js on the dashboard) may run there.
[[headers]]
  for = "/admin/dashboard/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'"

[[headers]]
  for = "/admin/login/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'"
