# getax.wenneker.io — Astro docs site + telemetry ingest (Netlify Function)

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# Telemetry ingest — same contract as telemetry-worker (POST /v1/events)
[[redirects]]
  from = "/v1/events"
  to = "/.netlify/functions/telemetry-ingest"
  status = 200
  force = true

[[redirects]]
  from = "/telemetry"
  to = "/.netlify/functions/telemetry-ingest"
  status = 200
  force = true

[[redirects]]
  from = "/v1/admin/login"
  to = "/.netlify/functions/admin-auth"
  status = 200
  force = true

[[redirects]]
  from = "/v1/admin/telemetry"
  to = "/.netlify/functions/admin-telemetry"
  status = 200
  force = true

[functions]
  node_bundler = "esbuild"

[functions."telemetry-ingest"]
  timeout = 10

[functions."admin-auth"]
  timeout = 10

[functions."admin-telemetry"]
  timeout = 26

# Version pointer: HTML (lang + title) for browsers; plain text for installers.
# Must come before the GitHub /releases/:version/* redirect.
[[redirects]]
  from = "/releases/latest.txt"
  to = "/.netlify/functions/latest-release"
  status = 200
  force = true

[functions."latest-release"]
  timeout = 5
  included_files = ["public/releases/latest.txt"]

# Legacy /releases/:version/* CDN URLs redirect to GitHub Releases (binaries no longer mirrored on Netlify).
[[redirects]]
  from = "/releases/:version/*"
  to = "https://github.com/GaryWenneker/ax/releases/download/:version/:splat"
  status = 302
  force = true
