[package]
name = "ax-desktop-client"
version = "4.3.0"
edition = "2021"
description = "Native wgpu Command Center for ax (egui/eframe)"
license = "MIT"

[[bin]]
name = "ax-desktop"
path = "src/main.rs"

[dependencies]
ax-web = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
reqwest = { workspace = true }
futures-util = { workspace = true }
dirs = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
eframe = { version = "0.31", default-features = true, features = ["wgpu", "default_fonts"] }
egui = "0.31"
egui_extras = { version = "0.31", features = ["all_loaders"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
urlencoding = "2"
