[package]
name = "ax-desktop-client"
version = "8.3.4"
edition = "2021"
description = "Native wgpu Command Center for ax (egui/eframe)"
license = "MIT"

[[bin]]
name = "ax-desktop"
path = "src/main.rs"

[dependencies]
ax-web = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
reqwest = { workspace = true }
futures-util = { workspace = true }
dirs = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# accesskit is a default eframe feature. It pulls atspi -> zbus_xml 4 ->
# quick-xml 0.30. RustSec RUSTSEC-2026-0194 and RUSTSEC-2026-0195 require
# quick-xml >= 0.41, and every published atspi-common still depends on an
# older quick-xml. Leave accesskit off until that chain is patched.
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "wgpu"] }
egui = "0.31"
egui_extras = { version = "0.31", features = ["all_loaders"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
urlencoding = "2"
