<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ax graph — __PROJECT_NAME__</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #1e1e1e; color: #d4d4d4;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  #bar { display: flex; align-items: center; gap: 12px; padding: 8px 14px;
    border-bottom: 1px solid #333; font-size: 13px; }
  #bar strong { font-size: 14px; }
  #bar .meta { color: #888; }
  #bar .spacer { flex: 1; }
  button { background: #2d2d2d; color: #d4d4d4; border: 1px solid #444;
    border-radius: 4px; padding: 4px 10px; cursor: pointer; font-size: 12px; }
  button:hover { background: #3a3a3a; }
  #wrap { position: absolute; top: 41px; left: 0; right: 0; bottom: 0; overflow: hidden; cursor: grab; }
  #wrap:active { cursor: grabbing; }
  canvas { display: block; }
  #legend { position: absolute; right: 12px; top: 53px; max-height: calc(100% - 66px);
    overflow-y: auto; padding: 8px 10px; background: rgba(37,37,37,0.9);
    border: 1px solid #444; border-radius: 6px; font-size: 11px; pointer-events: none; }
  .lt { font-weight: 600; color: #888; margin-bottom: 4px; }
  .lr { display: flex; align-items: center; gap: 6px; padding: 1px 0; }
  .sw { width: 10px; height: 10px; border-radius: 50%; }
  .ln { display: inline-block; width: 18px; border-top: 2px solid #888; }
  .ln.dashed { border-top-style: dashed; }
  .ln.dotted { border-top-style: dotted; }
  #tip { position: absolute; padding: 4px 8px; background: #252525; border: 1px solid #555;
    border-radius: 4px; font-size: 12px; pointer-events: none; display: none; max-width: 340px; }
</style>
</head>
<body>
<div id="bar">
  <strong>ax graph</strong>
  <span class="meta" id="meta">__PROJECT_NAME__</span>
  <span class="spacer"></span>
  <button id="reheat">Re-layout</button>
  <button id="fit">Fit</button>
</div>
<div id="wrap">
  <canvas id="cv"></canvas>
  <div id="legend"></div>
  <div id="tip"></div>
</div>
<script>
const DATA = "__GRAPH_DATA__";
const COLORS = ["#4ec9b0","#569cd6","#c586c0","#dcdcaa","#ce9178","#9cdcfe",
  "#d7ba7d","#4fc1ff","#b5cea8","#f48771","#c8c8c8","#e2c08d","#6a9955","#d16969","#808080","#7ca4cb"];
function colorFor(c){ return c < 0 ? "#666" : COLORS[c % COLORS.length]; }
function dashFor(c){ return c === "inferred" ? [4,3] : c === "ambiguous" ? [1,3] : []; }

const wrap = document.getElementById("wrap");
const canvas = document.getElementById("cv");
const ctx = canvas.getContext("2d");
const tip = document.getElementById("tip");

const idx = new Map();
DATA.nodes.forEach((n, i) => idx.set(n.id, i));
const nodes = DATA.nodes.map((n, i) => {
  const a = (i / Math.max(1, DATA.nodes.length)) * Math.PI * 2;
  return { ...n, x: Math.cos(a) * 300 + 400 + Math.random()*40, y: Math.sin(a) * 300 + 300 + Math.random()*40, vx: 0, vy: 0 };
});
const edges = [];
for (const e of DATA.edges) {
  const s = idx.get(e.s), t = idx.get(e.t);
  if (s != null && t != null && s !== t) edges.push({ source: s, target: t, kind: e.kind, confidence: e.confidence });
}
document.getElementById("meta").textContent =
  "__PROJECT_NAME__ · " + nodes.length + " of " + DATA.totalNodes + " nodes · " + edges.length + " edges";

let T = { scale: 1, ox: 0, oy: 0 };
let iter = 0, maxIter = 600;
let drag = { node: null, pan: false, lx: 0, ly: 0 };
let hover = null;

function resize(){
  const dpr = window.devicePixelRatio || 1;
  canvas.width = wrap.clientWidth * dpr;
  canvas.height = wrap.clientHeight * dpr;
  canvas.style.width = wrap.clientWidth + "px";
  canvas.style.height = wrap.clientHeight + "px";
}
resize();
window.addEventListener("resize", resize);

function radius(n){ return Math.min(3 + Math.sqrt(n.degree) * 1.6, 22); }

function stepPhysics(){
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.width / dpr, h = canvas.height / dpr;
  const cx = w/2, cy = h/2;
  const k = Math.sqrt((w*h) / Math.max(1, nodes.length));
  for (let i=0;i<nodes.length;i++){
    const a = nodes[i];
    for (let j=i+1;j<nodes.length;j++){
      const b = nodes[j];
      let dx=a.x-b.x, dy=a.y-b.y, d2=dx*dx+dy*dy;
      if (d2 < 0.01){ dx=Math.random()-0.5; dy=Math.random()-0.5; d2=0.01; }
      const d=Math.sqrt(d2), f=(k*k)/d, fx=(dx/d)*f, fy=(dy/d)*f;
      a.vx+=fx; a.vy+=fy; b.vx-=fx; b.vy-=fy;
    }
  }
  for (const e of edges){
    const a=nodes[e.source], b=nodes[e.target];
    const dx=a.x-b.x, dy=a.y-b.y, d=Math.sqrt(dx*dx+dy*dy)||0.01;
    const f=(d*d)/k, fx=(dx/d)*f, fy=(dy/d)*f;
    a.vx-=fx; a.vy-=fy; b.vx+=fx; b.vy+=fy;
  }
  const cooling = 1 - iter/maxIter;
  const maxDisp = 30*cooling + 1;
  for (const n of nodes){
    n.vx += (cx-n.x)*0.002; n.vy += (cy-n.y)*0.002;
    if (drag.node === n){ n.vx=0; n.vy=0; continue; }
    const disp=Math.sqrt(n.vx*n.vx+n.vy*n.vy)||0.01;
    const lim=Math.min(disp,maxDisp);
    n.x += (n.vx/disp)*lim; n.y += (n.vy/disp)*lim;
    n.vx*=0.85; n.vy*=0.85;
  }
}

function draw(){
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.width/dpr, h = canvas.height/dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h);
  ctx.translate(T.ox, T.oy); ctx.scale(T.scale, T.scale);
  ctx.lineWidth = 0.6;
  for (const e of edges){
    const a=nodes[e.source], b=nodes[e.target];
    ctx.beginPath();
    ctx.setLineDash(dashFor(e.confidence));
    const hl = hover && (a===hover || b===hover);
    ctx.strokeStyle = hl ? "rgba(200,200,255,0.7)" : "rgba(140,140,160,0.18)";
    ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
  }
  ctx.setLineDash([]);
  for (const n of nodes){
    const r = radius(n);
    const isDoc = n.kind === "doc";
    ctx.beginPath(); ctx.fillStyle = isDoc ? "#e0b341" : colorFor(n.community);
    if (isDoc){ ctx.rect(n.x-r,n.y-r,r*2,r*2); } else { ctx.arc(n.x,n.y,r,0,Math.PI*2); }
    ctx.fill();
    if (n === hover){ ctx.lineWidth=2; ctx.strokeStyle="#fff"; ctx.stroke(); }
    if (r > 8 || n === hover){
      ctx.fillStyle="rgba(230,230,230,0.9)"; ctx.font="10px monospace";
      ctx.fillText(n.name, n.x + r + 2, n.y + 3);
    }
  }
}

function frame(){
  if (iter < maxIter){ stepPhysics(); iter++; }
  draw();
  requestAnimationFrame(frame);
}
frame();

function toWorld(cx, cy){
  const r = canvas.getBoundingClientRect();
  return { x: (cx - r.left - T.ox)/T.scale, y: (cy - r.top - T.oy)/T.scale };
}
function nodeAt(cx, cy){
  const p = toWorld(cx, cy);
  for (let i=nodes.length-1;i>=0;i--){
    const n=nodes[i], r=radius(n)+3;
    if ((n.x-p.x)**2 + (n.y-p.y)**2 <= r*r) return n;
  }
  return null;
}
wrap.addEventListener("mousedown", ev => {
  const n = nodeAt(ev.clientX, ev.clientY);
  drag = n ? { node:n, pan:false, lx:ev.clientX, ly:ev.clientY } : { node:null, pan:true, lx:ev.clientX, ly:ev.clientY };
});
wrap.addEventListener("mousemove", ev => {
  if (drag.node){ const p=toWorld(ev.clientX,ev.clientY); drag.node.x=p.x; drag.node.y=p.y; }
  else if (drag.pan){ T.ox += ev.clientX-drag.lx; T.oy += ev.clientY-drag.ly; drag.lx=ev.clientX; drag.ly=ev.clientY; }
  else {
    const n = nodeAt(ev.clientX, ev.clientY); hover = n;
    if (n){ tip.style.display="block"; tip.style.left=(ev.clientX+12)+"px"; tip.style.top=(ev.clientY+12)+"px";
      tip.innerHTML = "<b>"+n.name+"</b> ("+n.kind+")<br>"+n.file+"<br>degree "+n.degree+(n.label?(" · "+n.label):""); }
    else tip.style.display="none";
  }
});
window.addEventListener("mouseup", () => { drag = { node:null, pan:false, lx:0, ly:0 }; });
wrap.addEventListener("wheel", ev => {
  ev.preventDefault();
  const r = canvas.getBoundingClientRect();
  const px = ev.clientX-r.left, py = ev.clientY-r.top;
  const factor = ev.deltaY < 0 ? 1.1 : 1/1.1;
  const ns = Math.min(4, Math.max(0.15, T.scale*factor));
  T.ox = px - ((px-T.ox)*ns)/T.scale; T.oy = py - ((py-T.oy)*ns)/T.scale; T.scale = ns;
}, { passive: false });

document.getElementById("reheat").onclick = () => { iter = 0; };
document.getElementById("fit").onclick = () => { T = { scale: 1, ox: 0, oy: 0 }; iter = 0; };

// Legend.
const legend = document.getElementById("legend");
const seen = new Map();
for (const n of nodes){ if (n.community >= 0 && !seen.has(n.community)) seen.set(n.community, n.label || ("#"+n.community)); }
let html = '<div class="lt">Communities</div>';
[...seen.entries()].slice(0,16).forEach(([id,label]) => {
  html += '<div class="lr"><span class="sw" style="background:'+colorFor(id)+'"></span>'+label+'</div>';
});
html += '<div class="lt" style="margin-top:8px">Edges</div>';
html += '<div class="lr"><span class="ln"></span> extracted</div>';
html += '<div class="lr"><span class="ln dashed"></span> inferred</div>';
html += '<div class="lr"><span class="ln dotted"></span> ambiguous</div>';
legend.innerHTML = html;
</script>
</body>
</html>
