[package]
name = "ax-cli"
version = "10.1.2"
edition = "2021"

[[bin]]
name = "ax"
path = "src/main.rs"

[features]
## The full distribution. A headless build (see `slim/`) uses `--no-default-features`.
default = ["web", "desktop", "self-update"]
## `ax web`, `ax share`, `ax ship --watch`, `ax server` and replication start-up (embedded Command Center).
web = ["dep:ax-web"]
## `ax desktop` native Command Center (wgpu/egui).
desktop = ["web", "dep:ax-desktop-client"]
## `ax upgrade` and the post-command update notice.
self-update = []
## Headless size option: link only the core tree-sitter grammars (see ax-extraction).
minimal-grammars = ["ax-extraction/minimal-grammars"]
## Use mimalloc as the global allocator (musl's malloc is slow under parallel indexing).
mimalloc = ["dep:mimalloc"]
## Enable wasmtime extractor plugins (`.ax/plugins/*/plugin.toml` with `wasm =`).
plugins-wasm = ["ax-extraction/plugins-wasm"]

[dependencies]
ax-db = { workspace = true }
ax-types = { workspace = true }
ax-utils = { workspace = true }
ax-core = { workspace = true }
ax-extraction = { workspace = true }
ax-context = { workspace = true }
ax-sync = { workspace = true }
ax-mcp = { workspace = true }
ax-web = { workspace = true, optional = true }
ax-desktop-client = { workspace = true, optional = true }
ax-graph = { workspace = true }
ax-telemetry = { workspace = true }
ax-usage = { workspace = true }
ax-reasoning = { workspace = true }
ax-neural = { workspace = true, features = ["neural-runtime"] }
ax-policy = { workspace = true }
ax-skill-catalog = { workspace = true }
ax-share = { workspace = true }
ax-memory = { workspace = true }
ax-git = { workspace = true }
ax-tia = { workspace = true }
ax-ship = { workspace = true }
ax-installer = { workspace = true }
ax-agent = { workspace = true }
ax-pi = { workspace = true }
ax-lsp = { workspace = true }
ax-docs-catalog = { workspace = true }
ax-global-db = { workspace = true }
ax-plugins = { workspace = true }
if-addrs = "0.15"
uuid = { workspace = true }
tokio = { workspace = true }
sysinfo = "0.40"
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
blake3 = { workspace = true }
sqlx = { workspace = true }
console = { workspace = true }
indicatif = { workspace = true }
owo-colors = { version = "4", features = ["supports-colors"] }
dialoguer = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }
dirs = { workspace = true }
reqwest = { workspace = true }
axum = "0.8"
sha2 = "0.11"
subtle = "2"
tempfile = "3"
zip = { workspace = true }
flate2 = { workspace = true }
tar = { workspace = true }
regex = { workspace = true }
mimalloc = { version = "0.1", optional = true, default-features = false }

[dev-dependencies]
