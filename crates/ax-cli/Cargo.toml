[package]
name = "ax-cli"
version = "4.2.0"
edition = "2021"

[[bin]]
name = "ax"
path = "src/main.rs"

[features]
default = []
## Enable wasmtime extractor plugins (`.ax/plugins/*/plugin.toml` with `wasm =`).
plugins-wasm = ["ax-extraction/plugins-wasm"]
## Enable ONNX Runtime dense memory embeddings (`AX_ONNX_MODEL` or `~/.ax/models/`).
onnx = ["ax-memory/onnx"]

[dependencies]
ax-types = { workspace = true }
ax-utils = { workspace = true }
ax-core = { workspace = true }
ax-extraction = { workspace = true }
ax-context = { workspace = true }
ax-sync = { workspace = true }
ax-mcp = { workspace = true }
ax-web = { workspace = true }
ax-desktop-client = { workspace = true }
ax-graph = { workspace = true }
ax-telemetry = { workspace = true }
ax-usage = { workspace = true }
ax-reasoning = { workspace = true }
ax-policy = { workspace = true }
ax-share = { workspace = true }
ax-memory = { workspace = true }
ax-git = { workspace = true }
ax-tia = { workspace = true }
ax-ship = { workspace = true }
ax-installer = { workspace = true }
ax-agent = { workspace = true }
ax-lsp = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
console = { workspace = true }
indicatif = { workspace = true }
owo-colors = { version = "4", features = ["supports-colors"] }
dialoguer = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
windows-sys = { version = "0.59", features = ["Win32_System_Console"] }
dirs = { workspace = true }
reqwest = { workspace = true }
zip = { workspace = true }
flate2 = { workspace = true }
tar = { workspace = true }
regex = { workspace = true }
