[package]
name = "ax-admin"
version = "10.1.1"
edition = "2021"
description = "Standalone admin application for a remote Ax, connected through its remote MCP endpoint"

[[bin]]
name = "ax-admin"
path = "src/main.rs"

[dependencies]
ax-remote-client = { workspace = true }
ax-utils = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
reqwest = { workspace = true }
clap = { workspace = true }
axum = "0.8"
include_dir = "0.7"
url = "2"
subtle = "2"
keyring = { version = "3", features = ["apple-native", "windows-native", "async-secret-service", "async-io", "crypto-rust"] }

[dev-dependencies]
ax-mcp = { workspace = true }
ax-core = { workspace = true }
ax-extraction = { workspace = true }
tempfile = "3"
sha2 = "0.10"
hex = "0.4"
tower = { version = "0.5", features = ["util"] }
jsonwebtoken = "10.3.0"
futures-core = "0.3"
