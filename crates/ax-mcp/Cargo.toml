[package]
name = "ax-mcp"
version = "8.0.0"
edition = "2021"

[dependencies]
ax-types = { workspace = true }
ax-utils = { workspace = true }
ax-core = { workspace = true }
ax-policy = { workspace = true }
ax-memory = { workspace = true }
ax-extraction = { workspace = true }
ax-context = { workspace = true }
ax-telemetry = { workspace = true }
ax-reasoning = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
ax-usage = { workspace = true }
ax-pi = { workspace = true }
ax-sync = { workspace = true }
ax-lsp = { workspace = true }
ax-ship = { workspace = true }
dirs = { workspace = true }
async-trait = { workspace = true }
sysinfo = "0.33"
sha2 = "0.10"
hex = "0.4"
axum = "0.8"
reqwest = { workspace = true }
jsonwebtoken = "9.3.1"
oauth2 = { version = "5", default-features = false, features = ["reqwest", "rustls-tls", "timing-resistant-secret-traits"] }
url = "2"
subtle = "2"
fs2 = { workspace = true }
keyring = { version = "3", features = ["apple-native", "windows-native", "async-secret-service", "async-io", "crypto-rust"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
