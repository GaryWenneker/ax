[package]
name = "ax-remote-client"
version = "10.1.2"
edition = "2021"
description = "Browser sign-in and token store for Ax remote MCP"

[dependencies]
ax-utils = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
reqwest = { workspace = true }
fs2 = { workspace = true }
sha2 = "0.11"
hex = "0.4"
axum = "0.8"
oauth2 = { version = "5", default-features = false, features = ["reqwest", "rustls-tls", "timing-resistant-secret-traits"] }
url = "2"
subtle = "2"
keyring = { version = "3", features = ["apple-native", "windows-native", "async-secret-service", "async-io", "crypto-rust"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
